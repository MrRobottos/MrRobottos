<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Official roles and credentials"><title>Official roles and credentials</title><defs><style>@font-face{font-family:FC;font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:FC;font-style:normal;font-weight:700;src:url(data:font/woff;base64,) format('woff')}text{font-family:FC,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fade{animation:fade .5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.3,.6,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .6s cubic-bezier(.2,.7,.2,1) both}@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.s{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{display:none}.s{display:inline}}</style></defs><rect x=".5" y=".5" width="799" height="449" rx="14" fill="#0d1117" stroke="#30363d"/><g class="rise" style="animation-delay:3.10s"><text x="28" y="38" font-size="15" font-weight="700" fill="#e6edf3">Official roles &amp; credentials</text></g><line x1="28" y1="66" x2="772" y2="66" stroke="#30363d"/><g class="rise" style="animation-delay:3.30s"><text x="28" y="92" font-size="13" font-weight="700" fill="#e6edf3">Referee &amp; Judge</text><text x="190" y="92" font-size="13" font-weight="400" fill="#e6edf3">FIRST Global Challenge</text><text x="390" y="91" font-size="12" font-weight="400" fill="#888888">World Robotics Championship · Incheon, South Korea</text><text x="390" y="107" font-size="12" font-weight="400" fill="#888888">October 2026 · 190+ nations competing</text><line x1="28" y1="122" x2="772" y2="122" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:3.40s"><text x="28" y="148" font-size="13" font-weight="700" fill="#e6edf3">Judge</text><text x="190" y="148" font-size="13" font-weight="400" fill="#e6edf3">FLL South Africa</text><text x="390" y="147" font-size="12" font-weight="400" fill="#888888">FIRST LEGO League · Regional &amp; National</text><text x="390" y="163" font-size="12" font-weight="400" fill="#888888">competitions · 2026 season</text><line x1="28" y1="178" x2="772" y2="178" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:3.50s"><text x="28" y="204" font-size="13" font-weight="700" fill="#e6edf3">Judge</text><text x="190" y="204" font-size="13" font-weight="400" fill="#e6edf3">FTC South Africa</text><text x="390" y="203" font-size="12" font-weight="400" fill="#888888">FIRST Tech Challenge · Regional competitions · 2026</text><text x="390" y="219" font-size="12" font-weight="400" fill="#888888">season</text><line x1="28" y1="234" x2="772" y2="234" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:3.60s"><text x="28" y="260" font-size="13" font-weight="700" fill="#e6edf3">Mentor &amp; Coach</text><text x="190" y="260" font-size="13" font-weight="400" fill="#e6edf3">Robotics Teams</text><text x="390" y="259" font-size="12" font-weight="400" fill="#888888">Programming · Build strategy · Engineering process</text><text x="390" y="275" font-size="12" font-weight="400" fill="#888888">Team leadership &amp; culture</text><line x1="28" y1="290" x2="772" y2="290" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:3.70s"><text x="28" y="316" font-size="13" font-weight="700" fill="#e6edf3">Founder</text><text x="190" y="316" font-size="13" font-weight="400" fill="#e6edf3">Wired Minds</text><text x="390" y="315" font-size="12" font-weight="400" fill="#888888">Agritech company · Smart livestock systems</text><text x="390" y="331" font-size="12" font-weight="400" fill="#888888">Building from zero</text><line x1="28" y1="346" x2="772" y2="346" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:3.80s"><text x="28" y="372" font-size="13" font-weight="700" fill="#e6edf3">Creator</text><text x="190" y="372" font-size="13" font-weight="400" fill="#BA7517">Rogue Engineers</text><text x="390" y="371" font-size="12" font-weight="400" fill="#888888">Robotics education platform · Global audience</text><line x1="28" y1="386" x2="772" y2="386" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:4.10s"><text x="28" y="412" font-size="12" font-weight="400" fill="#888888">Being a judge and mentor is not just a credential - it means I understand what separates teams that</text><text x="28" y="428" font-size="12" font-weight="400" fill="#888888">win from teams that only compete. That perspective informs everything I build.</text></g></svg>