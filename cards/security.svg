<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Bug bounty and security research"><title>Bug bounty and security research</title><defs><style>@font-face{font-family:FC;font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:FC;font-style:normal;font-weight:700;src:url(data:font/woff;base64,) format('woff')}text{font-family:FC,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fade{animation:fade .5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.3,.6,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .6s cubic-bezier(.2,.7,.2,1) both}@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.s{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{display:none}.s{display:inline}}</style></defs><rect x=".5" y=".5" width="799" height="449" rx="14" fill="#0d1117" stroke="#30363d"/><rect x="0" y="22" width="4" height="406" rx="2" fill="#E24B4A" class="grow" style="animation-delay:3.70s"/><g class="rise" style="animation-delay:3.70s"><text x="28" y="38" font-size="15" font-weight="700" fill="#e6edf3">Bug bounty &amp; security research</text></g><g class="rise" style="animation-delay:3.85s"><text x="28" y="70" font-size="13" font-weight="400" fill="#888888">Security is not a separate discipline for me - it is built into everything I build. Every</text><text x="28" y="90" font-size="13" font-weight="400" fill="#888888">Wired Minds IoT device, every API endpoint, every dashboard is designed with security-first</text><text x="28" y="110" font-size="13" font-weight="400" fill="#888888">thinking because I understand what attackers look for.</text></g><g class="rise" style="animation-delay:4.00s"><text x="28" y="144" font-size="11" font-weight="400" fill="#888888">Focus areas</text></g><g class="rise" style="animation-delay:4.10s"><text x="28" y="176" font-size="13" font-weight="700" fill="#e6edf3">Web application vulnerabilities</text><text x="290" y="175" font-size="12" font-weight="400" fill="#888888">OWASP Top 10, business logic flaws, broken access control</text><line x1="28" y1="154" x2="772" y2="154" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:4.20s"><text x="28" y="218" font-size="13" font-weight="700" fill="#e6edf3">IoT security</text><text x="290" y="217" font-size="12" font-weight="400" fill="#888888">device communication, firmware analysis, unencrypted data</text><text x="290" y="233" font-size="12" font-weight="400" fill="#888888">streams</text><line x1="28" y1="196" x2="772" y2="196" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:4.30s"><text x="28" y="276" font-size="13" font-weight="700" fill="#e6edf3">Authentication &amp; authorisation</text><text x="290" y="275" font-size="12" font-weight="400" fill="#888888">JWT vulnerabilities, session management, privilege escalation</text><line x1="28" y1="254" x2="772" y2="254" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:4.40s"><text x="28" y="318" font-size="13" font-weight="700" fill="#e6edf3">API security</text><text x="290" y="317" font-size="12" font-weight="400" fill="#888888">REST API fuzzing, parameter manipulation, mass assignment</text><line x1="28" y1="296" x2="772" y2="296" stroke="#30363d" stroke-opacity=".5"/></g><g class="rise" style="animation-delay:4.70s"><text x="28" y="352" font-size="11" font-weight="400" fill="#888888">Learning path</text></g><path d="M102.4 380 L697.6 380" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-opacity=".6" pathLength="1" class="draw" style="animation-delay:4.80s"/><g class="rise" style="animation-delay:4.90s"><circle cx="102.4" cy="380" r="5" fill="#E24B4A"/><text x="102.4" y="406" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">PortSwigger Web</text><text x="102.4" y="420" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">Security Academy</text></g><g class="rise" style="animation-delay:5.02s"><circle cx="251.2" cy="380" r="5" fill="#E24B4A"/><text x="251.2" y="406" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">Practice on CTFs</text></g><g class="rise" style="animation-delay:5.14s"><circle cx="400.0" cy="380" r="5" fill="#E24B4A"/><text x="400" y="406" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">Bug Bounty</text><text x="400" y="420" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">programmes</text></g><g class="rise" style="animation-delay:5.26s"><circle cx="548.8" cy="380" r="5" fill="#E24B4A"/><text x="548.8" y="406" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">Responsible</text><text x="548.8" y="420" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">disclosure</text></g><g class="rise" style="animation-delay:5.38s"><circle cx="697.6" cy="380" r="10" fill="none" stroke="#E24B4A" stroke-opacity=".35"/><circle cx="697.6" cy="380" r="5" fill="#E24B4A"/><text x="697.6" y="406" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">Building more secure</text><text x="697.6" y="420" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="middle">products</text></g></svg>