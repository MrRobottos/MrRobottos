<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 324" width="800" height="324" role="img" aria-label="Rogue Engineers: robotics education from absolute zero"><title>Rogue Engineers: robotics education from absolute zero</title><defs><style>@font-face{font-family:FC;font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:FC;font-style:normal;font-weight:700;src:url(data:font/woff;base64,) format('woff')}text{font-family:FC,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fade{animation:fade .5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.3,.6,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .6s cubic-bezier(.2,.7,.2,1) both}@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.s{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{display:none}.s{display:inline}}</style></defs><rect x=".5" y=".5" width="799" height="323" rx="14" fill="#0d1117" stroke="#30363d"/><rect x="0" y="22" width="4" height="280" rx="2" fill="#BA7517" class="grow" style="animation-delay:2.50s"/><g class="rise" style="animation-delay:2.50s"><text x="28" y="38" font-size="15" font-weight="700" fill="#e6edf3">Rogue Engineers</text></g><g class="rise" style="animation-delay:2.58s"><text x="28" y="58" font-size="12" font-weight="400" fill="#BA7517">Robotics is for everyone. We prove it daily.</text></g><g class="rise" style="animation-delay:2.70s"><text x="28" y="92" font-size="13" font-weight="400" fill="#888888">A robotics education platform built on one belief - that engineering should be accessible to</text><text x="28" y="112" font-size="13" font-weight="400" fill="#888888">every young person regardless of background, budget, or geography. Teaching Python, Arduino,</text><text x="28" y="132" font-size="13" font-weight="400" fill="#888888">ROS2, FIRST Robotics, circuit design, and robot mechanics from absolute zero. No equipment</text><text x="28" y="152" font-size="13" font-weight="400" fill="#888888">needed to start. No prerequisites. No gatekeeping.</text></g><g class="rise" style="animation-delay:2.90s"><text x="28" y="188" font-size="11" font-weight="400" fill="#888888">What I teach</text></g><g class="rise" style="animation-delay:3.00s"><rect x="28.0" y="202" width="158.8" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="107.4" y="219" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Python for Robotics</text></g><g class="rise" style="animation-delay:3.05s"><rect x="194.8" y="202" width="209.2" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="299.4" y="219" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Arduino &amp; Embedded Systems</text></g><g class="rise" style="animation-delay:3.10s"><rect x="412.0" y="202" width="50.8" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="437.4" y="219" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">ROS2</text></g><g class="rise" style="animation-delay:3.15s"><rect x="470.8" y="202" width="122.8" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="532.2" y="219" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Circuit Design</text></g><g class="rise" style="animation-delay:3.20s"><rect x="28.0" y="236" width="187.6" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="121.8" y="253" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">FIRST Robotics Strategy</text></g><g class="rise" style="animation-delay:3.25s"><rect x="223.6" y="236" width="130.0" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="288.6" y="253" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Robot Mechanics</text></g><g class="rise" style="animation-delay:3.30s"><rect x="361.6" y="236" width="130.0" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="426.6" y="253" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">IoT Integration</text></g><g class="rise" style="animation-delay:3.35s"><rect x="499.6" y="236" width="130.0" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="564.6" y="253" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Computer Vision</text></g><g class="rise" style="animation-delay:3.40s"><rect x="28.0" y="270" width="144.4" height="26" rx="13" fill="#161b22" stroke="#BA7517"/><text x="100.2" y="287" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Bug Bounty Basics</text></g></svg>